name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build e testes (core, knowledge, coach, cli)
        run: ./gradlew build --no-daemon
      - name: Gera fitness.db e relatório de integridade
        run: ./gradlew :knowledge:buildKnowledgeDb --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fitness-db
          path: knowledge/build/fitness.db
